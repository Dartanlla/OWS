version: '3.7'

services:

  # ELK Stack Setup
  setup:
    extends:
      file: .docker/logging.yml
      service: setup

  # Elastic Search
  elasticsearch:
    extends:
      file: .docker/logging.yml
      service: elasticsearch

  # LogStash
  logstash:
    depends_on:
       - elasticsearch
    extends:
      file: .docker/logging.yml
      service: logstash

  # Kibana
  kibana:
    depends_on:
      - elasticsearch
    extends:
      file: .docker/logging.yml
      service: kibana
  
  # Heartbeat
  heartbeat:
    depends_on:
      - elasticsearch
    extends:
      file: .docker/logging.yml
      service: heartbeat

  # Database
  database:
    extends:
      file: .docker/databases.yml
      service: ${DATABASE}

  # Messaging Service
  messaging:
    extends:
      file: .docker/messaging.yml
      service: rabbitmq

  #matchmakingcache:
  # extends:
  #  file: .docker/matchmakingcache.yml
  #  service: matchmakingcache

  # User Session Cache (ValKey)
  usersessioncache:
    extends:
      file: .docker/usersessioncache.yml
      service: usersessioncache

  # Short-lived external connection tickets (Valkey)
  owsticket:
    extends:
      file: .docker/owsticket.yml
      service: owsticket

  # OWS Public Api
  owspublicapi:
    image: ${REGISTRY:-ows}/owspublicapi:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSPublicAPI/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
     - OWSTicketConfig__ConnectionString=owsticket:6379,password=${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword before starting Compose}
     - OWS_TICKET_REDEMPTION_API_KEY=${OWSTicketRedemptionApiKey:?Set OWSTicketRedemptionApiKey before starting Compose}
    ports:
      - "44302:80"
      - "44303:443"
    depends_on:
      - database
      - messaging
      - owsticket

  # OWS Instance Management 
  owsinstancemanagement:
    image: ${REGISTRY:-ows}/owsinstancemanagement:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSInstanceManagement/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
     - RabbitMQOptions__RabbitMQHostName=${RabbitMQHostName}
     - RabbitMQOptions__RabbitMQPort=${RabbitMQPort}
     - RabbitMQOptions__RabbitMQUserName=${RabbitMQUserName}
     - RabbitMQOptions__RabbitMQPassword=${RabbitMQPassword}
      - AWS_PROFILE=default
      - AWS_REGION=us-east-1
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    ports:
      - "44328:80"
      - "44329:443"
    depends_on:
      - database
      - messaging

  # OWS Character Persistence
  owscharacterpersistence:
    image: ${REGISTRY:-ows}/owscharacterpersistence:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSCharacterPersistence/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
     - RabbitMQOptions__RabbitMQHostName=${RabbitMQHostName}
     - RabbitMQOptions__RabbitMQPort=${RabbitMQPort}
     - RabbitMQOptions__RabbitMQUserName=${RabbitMQUserName}
     - RabbitMQOptions__RabbitMQPassword=${RabbitMQPassword}
    ports:
      - "44323:80"
      - "44324:443"
    depends_on:
      - database
      - messaging

  # OWS Global Data
  owsglobaldata:
    image: ${REGISTRY:-ows}/owsglobaldata:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSGlobalData/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
     - RabbitMQOptions__RabbitMQHostName=${RabbitMQHostName}
     - RabbitMQOptions__RabbitMQPort=${RabbitMQPort}
     - RabbitMQOptions__RabbitMQUserName=${RabbitMQUserName}
     - RabbitMQOptions__RabbitMQPassword=${RabbitMQPassword}
    ports:
      - "44325:80"
      - "44326:443"
    depends_on:
      - database
      - messaging

  # OWS Management
  owsmanagement:
    image: ${REGISTRY:-ows}/owsmanagement:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSManagement/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
    ports:
      - "44410:80"
      - "44411:443"
    depends_on:
      - database
      - messaging

  # OWS Content
  owscontent:
    image: ${REGISTRY:-ows}/owscontent:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSContent/Dockerfile
    environment:
     - OWSStorageConfig__OWSDBBackend=${DATABASE}
     - OWSStorageConfig__OWSDBConnectionString=${DATABASE_CONNECTION_STRING}
     - OWSAPIPathConfig__InternalPublicApiURL=${InternalPublicApiURL}
     - OWSAPIPathConfig__InternalInstanceManagementApiURL=${InternalInstanceManagementApiURL}
     - OWSAPIPathConfig__InternalCharacterPersistenceApiURL=${InternalCharacterPersistenceApiURL}
     - ContentCacheConfig__Endpoint=http://owscontentcache:9000
     - ContentCacheConfig__AccessKey=${MINIO_ROOT_USER}
     - ContentCacheConfig__SecretKey=${MINIO_ROOT_PASSWORD}
     - ContentCacheConfig__BucketName=${MINIO_BUCKET_NAME}
    ports:
      - "44430:80"
      - "44431:443"
    depends_on:
      - database
      - messaging
      - owscontentcache
    restart: on-failure

  # OWS Content Cache (MinIO - internal only)
  owscontentcache:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - owscontentcache:/data

networks:
  elk:
    driver: bridge
volumes:
  setup:
    name: "ows2-setup"
  elasticsearch:
    name: "ows2-elasticsearch"
  database:
    name: "ows2-database"
  messaging:
    name: "ows2-messaging"
  matchmakingcache:
    name: "ows2-matchmakingcache"
  usersessioncache:
    name: "ows2-usersessioncache"
  owscontentcache:
    name: "ows2-owscontentcache"
