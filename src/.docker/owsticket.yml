version: '3.7'

services:
  owspublicapi:
    environment:
      - OWSTicketConfig__ConnectionString=owsticket:6379,password=${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword in .env.tickets}
      - OWS_INSTANCE_ASSIGNMENT_CREDENTIAL=${OWS_INSTANCE_ASSIGNMENT_CREDENTIAL:-}
    depends_on:
      - owsticket

  owsinstancemanagement:
    environment:
      - OWS_INSTANCE_LAUNCHER_CREDENTIAL=${OWS_INSTANCE_LAUNCHER_CREDENTIAL:-}
      - OWSTicketConfig__ConnectionString=owsticket:6379,password=${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword in .env.tickets}
      - OWS_INSTANCE_ASSIGNMENT_CREDENTIAL=${OWS_INSTANCE_ASSIGNMENT_CREDENTIAL:-}
      - OWS_EDGE_PRIVATE_HTTPS_PORT=${OWS_EDGE_PRIVATE_HTTPS_PORT:-}
    depends_on:
      - owsticket

  owsticket:
    image: valkey/valkey:latest
    restart: always
    command:
      - valkey-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --requirepass
      - ${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword in .env.tickets}
    ports:
      - "127.0.0.1:6380:6379"
