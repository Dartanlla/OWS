version: '3.7'

services:
  owspublicapi:
    environment:
      - OWSTicketConfig__ConnectionString=owsticket:6379,password=${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword in .env.tickets}
      - OWS_TICKET_REDEMPTION_API_KEY=${OWSTicketRedemptionApiKey:?Set OWSTicketRedemptionApiKey in .env.tickets}
    depends_on:
      - owsticket

  owsticket:
    image: valkey/valkey:latest
    restart: always
    command:
      - valkey-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --requirepass
      - ${OWSTicketValkeyPassword:?Set OWSTicketValkeyPassword in .env.tickets}
    ports:
      - "127.0.0.1:6380:6379"
