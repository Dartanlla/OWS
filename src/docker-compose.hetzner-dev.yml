x-ows-common-env: &ows-common-env
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
  ASPNETCORE_URLS: "http://+:80"
  OWSStorageConfig__OWSDBBackend: "postgres"
  OWSStorageConfig__OWSDBConnectionString: "${DATABASE_CONNECTION_STRING}"
  # Per-service Npgsql pool cap. Six services share one Postgres (max_connections=40),
  # so 6 x 5 = 30 stays under the ceiling with headroom for admin/superuser. Raise this
  # once Postgres has more connections or PgBouncer sits in front (see Phase 3).
  OWS_DB_MAX_POOL_SIZE: "${OWS_DB_MAX_POOL_SIZE:-5}"
  OWS_DB_MIN_POOL_SIZE: "${OWS_DB_MIN_POOL_SIZE:-1}"
  # Session cache (Valkey). Only OWSPublicAPI consumes it; inert for the other services.
  UserSessionCacheOptions__Enabled: "${OWS_SESSION_CACHE_ENABLED:-true}"
  UserSessionCacheOptions__ConnectionString: "usersessioncache:6379"
  UserSessionCacheOptions__Password: "${UserSessionCacheValkeyPassword}"
  # gRPC guard rails (Chat/Party). Caps + rate limits are always enforced. Session auth binds each
  # stream to its session's character; a game client that sends no usersessionguid metadata loses
  # chat, so turn it on only after the live Steam build sends it (docs/hosting/hetzner-dev.md).
  OWS_GRPC_MAX_CONNECTIONS: "${OWS_GRPC_MAX_CONNECTIONS:-5000}"
  OWS_GRPC_MSGS_PER_WINDOW: "${OWS_GRPC_MSGS_PER_WINDOW:-20}"
  OWS_GRPC_RATE_WINDOW_SECONDS: "${OWS_GRPC_RATE_WINDOW_SECONDS:-5}"
  OWS_GRPC_REQUIRE_SESSION_AUTH: "${OWS_GRPC_REQUIRE_SESSION_AUTH:-false}"
  # Require X-Samsara-Service-Key on the CharacterPersistence API (gold/inventory/stats writes).
  # Keep false until the UE persistence calls send the key, or all persistence traffic is 401'd.
  OWS_REQUIRE_CHARACTER_WRITE_KEY: "${OWS_REQUIRE_CHARACTER_WRITE_KEY:-false}"
  # Require GetServerToConnectTo to prove the session owns the character (by UserGUID). The
  # shipping client sends UserSessionGUID on every travel path the game uses, so this should be
  # safe to enable; if a client path still sends an empty session it logs
  # "no UserSessionGUID" client-side (PlayerCharacterGASController.cpp) and the request is
  # rejected with "Invalid or expired User Session".
  OWS_REQUIRE_SESSION_CHARACTER_BINDING: "${OWS_REQUIRE_SESSION_CHARACTER_BINDING:-false}"
  OWSAPIPathConfig__InternalPublicApiURL: "http://owspublicapi/"
  OWSAPIPathConfig__InternalInstanceManagementApiURL: "http://owsinstancemanagement/"
  OWSAPIPathConfig__InternalCharacterPersistenceApiURL: "http://owscharacterpersistence/"
  RabbitMQOptions__RabbitMQHostName: "messaging"
  RabbitMQOptions__RabbitMQPort: "5672"
  RabbitMQOptions__RabbitMQUserName: "${RABBITMQ_DEFAULT_USER}"
  RabbitMQOptions__RabbitMQPassword: "${RABBITMQ_DEFAULT_PASS}"
  Serilog__MinimumLevel__Default: "Information"
  Serilog__MinimumLevel__Override__Microsoft: "Warning"
  Serilog__MinimumLevel__Override__System: "Warning"
  # One 1.5 KB Information line per refused or dropped gRPC stream; refused clients retry every second.
  Serilog__MinimumLevel__Override__Grpc: "Warning"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft: "Warning"
  Logging__LogLevel__System: "Warning"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# App services answer /health on port 80 (OWSData/Health/OWSHealthChecks.cs); the images have bash, not curl.
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

services:
  database:
    build:
      context: .docker/postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    volumes:
      - hetzner-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    mem_limit: "${DATABASE_MEM_LIMIT:-768m}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  messaging:
    image: rabbitmq:3.9.0-management-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - hetzner-rabbitmq-data:/var/lib/rabbitmq
      - ./.docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    mem_limit: "${RABBITMQ_MEM_LIMIT:-384m}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  usersessioncache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *default-logging
    command: valkey-server --appendonly yes --requirepass "${UserSessionCacheValkeyPassword}"
    volumes:
      - hetzner-valkey-data:/data
    ports:
      - "127.0.0.1:${OWS_VALKEY_HOST_PORT:-6379}:6379"
    mem_limit: "${OWS_VALKEY_MEM_LIMIT:-128m}"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${UserSessionCacheValkeyPassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations:
    image: ${REGISTRY:-ows}/owsmigrations:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSDatabaseMigrations/Dockerfile
    restart: "no"
    logging: *default-logging
    environment:
      OWS_DB_CONNECTION_STRING: "${DATABASE_CONNECTION_STRING}"
      # Set to "true" for the first run against a database that already has the schema:
      # it marks every manifest script as applied without executing anything.
      OWS_MIGRATIONS_BASELINE: "${OWS_MIGRATIONS_BASELINE:-false}"
    volumes:
      - ../Databases/Postgres:/migrations:ro
    depends_on:
      database:
        condition: service_healthy

  owspublicapi:
    image: ${REGISTRY:-ows}/owspublicapi:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSPublicAPI/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
      SteamConfig__WebApiHost: "${STEAM_WEB_API_HOST:-https://api.steampowered.com}"
      SteamConfig__WebApiKey: "${STEAM_WEB_API_KEY:-}"
      SteamConfig__AppId: "${STEAM_APP_ID:-}"
      SteamConfig__Identity: "${STEAM_IDENTITY:-samsarasaga}"
      # Second entry of the login screen's server list (index 0 is the baked-in NA-EAST entry in
      # OWSPublicAPI/appsettings.json). Config arrays merge by index, so this ADDS a row without
      # touching the first. Region is the routing key: it must match the SEA launcher's ServerRegion
      # exactly. Defaults to maintenance so the row is inert - the client refuses to enter a server
      # that is not "online" - until the VM exists and OWS_SERVER_SEA_STATUS is flipped.
      GameServersConfig__Servers__1__Name: "${OWS_SERVER_SEA_NAME:-}"
      GameServersConfig__Servers__1__Region: "${OWS_SERVER_SEA_REGION:-SEA}"
      GameServersConfig__Servers__1__Status: "${OWS_SERVER_SEA_STATUS:-maintenance}"
      GameServersConfig__Servers__1__Population: "${OWS_SERVER_SEA_POPULATION:-low}"
      GameServersConfig__Servers__1__PingHost: "${OWS_SERVER_SEA_PINGHOST:-}"
    ports:
      - "${OWS_API_BIND:-127.0.0.1}:${OWS_PUBLIC_API_PORT:-44302}:80"
    mem_limit: "${OWS_PUBLIC_API_MEM_LIMIT:-384m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      usersessioncache:
        condition: service_healthy

  owsinstancemanagement:
    image: ${REGISTRY:-ows}/owsinstancemanagement:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSInstanceManagement/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
    ports:
      - "127.0.0.1:${OWS_INSTANCE_MANAGEMENT_HOST_PORT:-44328}:80"
    mem_limit: "${OWS_INSTANCE_MANAGEMENT_MEM_LIMIT:-384m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  owscharacterpersistence:
    image: ${REGISTRY:-ows}/owscharacterpersistence:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSCharacterPersistence/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
      # Server-to-server key for the PlayerShops endpoints. The API fails closed outside
      # Development when this is unset; the UE zone server reads the same variable.
      OWS_SAMSARA_SERVICE_KEY: "${OWS_SAMSARA_SERVICE_KEY:-}"
    ports:
      - "127.0.0.1:${OWS_CHARACTER_PERSISTENCE_HOST_PORT:-44323}:80"
    mem_limit: "${OWS_CHARACTER_PERSISTENCE_MEM_LIMIT:-384m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  owsglobaldata:
    image: ${REGISTRY:-ows}/owsglobaldata:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSGlobalData/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
    ports:
      - "${OWS_API_BIND:-127.0.0.1}:${OWS_GLOBAL_DATA_PORT:-44325}:80"
    mem_limit: "${OWS_GLOBAL_DATA_MEM_LIMIT:-256m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  # Admin console (REST API + Vue SPA). Bound to loopback with no exception, because its
  # only credential is the X-CustomerGUID header, which the game client already sends on
  # every public call. Reach it with an SSH tunnel:
  #   ssh -L 44410:127.0.0.1:44410 <user>@<host>   then open http://localhost:44410
  # Do not add it to the Caddy proxy or move it off 127.0.0.1 until it has a real login.
  owsmanagement:
    image: ${REGISTRY:-ows}/owsmanagement:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSManagement/Dockerfile
    # Opt-in: only starts with `--profile admin`, so a plain `up -d` leaves it alone. The
    # other services already reserve 3328m of a 4 GB host; the console is an occasional-use
    # tool and does not need to hold memory between sessions.
    profiles: ["admin"]
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
    ports:
      - "127.0.0.1:${OWS_MANAGEMENT_HOST_PORT:-44410}:80"
    mem_limit: "${OWS_MANAGEMENT_MEM_LIMIT:-256m}"
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  owschat:
    image: ${REGISTRY:-ows}/owschat:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSChat/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
      ASPNETCORE_URLS: "http://+:50051"
      Kestrel__EndpointDefaults__Protocols: "Http2"
    ports:
      - "${OWS_CHAT_GRPC_PORT:-50051}:50051"
      - "127.0.0.1:${OWS_CHAT_HEALTH_PORT:-44351}:80"
    mem_limit: "${OWS_CHAT_MEM_LIMIT:-256m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  owsparty:
    image: ${REGISTRY:-ows}/owsparty:${PLATFORM:-linux}-${TAG:-latest}
    build:
      context: .
      dockerfile: OWSParty/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *app-healthcheck
    environment:
      <<: *ows-common-env
    ports:
      - "${OWS_API_BIND:-127.0.0.1}:${OWS_PARTY_HTTP_PORT:-44306}:80"
      - "${OWS_API_BIND:-127.0.0.1}:${OWS_PARTY_GRPC_PORT:-44364}:50051"
    mem_limit: "${OWS_PARTY_MEM_LIMIT:-384m}"
    depends_on:
      database:
        condition: service_healthy
      messaging:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    # Opt-in: only starts with `--profile tls`. Until real domains + DNS exist, run without the
    # profile and set OWS_API_BIND=0.0.0.0 to serve the APIs directly over their host ports.
    # To switch to HTTPS: set OWS_PUBLIC_API_DOMAIN/OWS_GLOBAL_DATA_DOMAIN, point DNS at the host,
    # set OWS_API_BIND=127.0.0.1, and deploy with `--profile tls`.
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./.docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - hetzner-caddy-data:/data
      - hetzner-caddy-config:/config
    environment:
      # Set these to real hostnames (e.g. api.example.com) with A records pointing at this
      # host to get Let's Encrypt certificates; the .localhost defaults use internal certs.
      OWS_PUBLIC_API_DOMAIN: "${OWS_PUBLIC_API_DOMAIN:-api.localhost}"
      OWS_GLOBAL_DATA_DOMAIN: "${OWS_GLOBAL_DATA_DOMAIN:-globaldata.localhost}"
    mem_limit: "${PROXY_MEM_LIMIT:-128m}"
    depends_on:
      - owspublicapi
      - owsglobaldata

volumes:
  hetzner-postgres-data:
    name: "${COMPOSE_PROJECT_NAME:-ows-hetzner-dev}-postgres-data"
  hetzner-rabbitmq-data:
    name: "${COMPOSE_PROJECT_NAME:-ows-hetzner-dev}-rabbitmq-data"
  hetzner-valkey-data:
    name: "${COMPOSE_PROJECT_NAME:-ows-hetzner-dev}-valkey-data"
  hetzner-caddy-data:
    name: "${COMPOSE_PROJECT_NAME:-ows-hetzner-dev}-caddy-data"
  hetzner-caddy-config:
    name: "${COMPOSE_PROJECT_NAME:-ows-hetzner-dev}-caddy-config"
